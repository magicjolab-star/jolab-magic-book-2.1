name: Build installable APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-play/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-play
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Magic-Book-3.0.2-installable.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Book-3.0.2-APK
          path: android-play/app/build/outputs/apk/debug/Magic-Book-3.0.2-installable.apk
          if-no-files-found: error
          retention-days: 30
