name: Build Magic Book Play Bundle

on:
  push:
    paths:
      - 'android-play/**'
      - '.github/workflows/build-play-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare app artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-play/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-play/app/src/main/res/drawable-nodpi
          curl -fsSL 'https://jolab-magic-book-20.vercel.app/api/visual?size=192&v=304' -o android-play/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          curl -fsSL 'https://jolab-magic-book-20.vercel.app/api/visual?size=512&v=304' -o android-play/app/src/main/res/drawable-nodpi/splash.webp

      - name: Generate upload key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' 'AZ' | cut -c1-40)"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=magicbook" >> "$GITHUB_ENV"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android-play/magic-book-upload.keystore" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android-play/magic-book-upload.keystore" \
            -alias magicbook \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Magic Jolab, OU=Magic Book, O=Magic Jolab, L=Quebec, ST=Quebec, C=CA"
          printf '%s\n' "$PASS" > "$GITHUB_WORKSPACE/android-play/UPLOAD_KEY_PASSWORD.txt"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/android-play/magic-book-upload.keystore" -alias magicbook -storepass "$PASS" | tee "$GITHUB_WORKSPACE/android-play/CERTIFICATE_INFO.txt"
          FP="$(grep 'SHA256:' "$GITHUB_WORKSPACE/android-play/CERTIFICATE_INFO.txt" | sed 's/.*SHA256: //')"
          printf '%s\n' "$FP" > "$GITHUB_WORKSPACE/android-play/SHA256_FINGERPRINT.txt"
          cat > "$GITHUB_WORKSPACE/android-play/assetlinks.json" <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.magicjolab.magicbook",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          JSON

      - name: Build signed App Bundle and APK
        working-directory: android-play
        run: |
          gradle --no-daemon bundleRelease assembleRelease

      - name: Collect output
        run: |
          mkdir -p play-output
          cp android-play/app/build/outputs/bundle/release/app-release.aab play-output/Magic-Book-3.0.2.aab
          cp android-play/app/build/outputs/apk/release/app-release.apk play-output/Magic-Book-3.0.2.apk
          cp android-play/magic-book-upload.keystore play-output/
          cp android-play/UPLOAD_KEY_PASSWORD.txt play-output/
          cp android-play/SHA256_FINGERPRINT.txt play-output/
          cp android-play/CERTIFICATE_INFO.txt play-output/
          cp android-play/assetlinks.json play-output/

      - name: Upload Play Store package
        uses: actions/upload-artifact@v4
        with:
          name: magic-book-playstore-ready
          path: play-output/
          if-no-files-found: error
          retention-days: 30
